name: UART RTL Simulation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  simulate:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Icarus Verilog
      run: |
        sudo apt-get update
        sudo apt-get install -y iverilog

    - name: Compile RTL
      run: |
        iverilog -o uart_sim \
        rtl/baud_gen.v \
        rtl/uart_tx.v \
        rtl/uart_rx.v \
        rtl/uart_top.v \
        tb/uart_tb.v

    - name: Run Simulation
      run: |
        vvp uart_sim
